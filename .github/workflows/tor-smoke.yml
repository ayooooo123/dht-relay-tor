name: Tor proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.19.0'
  RUST_VERSION: '1.96.1'
  BARE_VERSION: '1.30.3'
  BARE_MAKE_VERSION: '1.6.3'
  CMAKE_RUNTIME_VERSION: '4.3.1'
  CMAKE_BARE_VERSION: '1.8.0'
  CMAKE_CARGO_VERSION: '0.0.4'
  BARE_ARTI_SHA: d628e48498eec43f665a21dcf0015005683150ab
  WORKFLOW_TIMEOUT_MS: '1800000'
  PROOF_SETUP_RESERVE_MS: '180000'
  PROOF_POST_RESERVE_MS: '120000'
  PROOF_RETRY_DELAY_MS: '15000'
  SYSTEM_ATTEMPT_TIMEOUT_MS: '540000'
  EMBEDDED_ATTEMPT_TIMEOUT_MS: '660000'

# This Linux workflow proves the linux-x64 addon and Tor data path. It does not
# establish macOS publish readiness; a future darwin release proof must build
# and attest darwin prebuilds on a pinned macOS runner/toolchain.
jobs:
  system_tor:
    name: System Tor control
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact dht-relay-tor source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and inventory the control toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tor
          npm ci
          test "$(node -p "require('./node_modules/bare-runtime/package.json').version")" = "$BARE_VERSION"
          bare_bin="$(node -p "require('bare-runtime')('bare')")"
          chmod +x "$bare_bin"

          mkdir -p evidence
          {
            printf 'dht-relay-tor-sha=%s\n' "$(git rev-parse HEAD)"
            printf 'runner-image=%s\n' "${ImageOS:-unknown}-${ImageVersion:-unknown}"
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n' "$(npm --version)"
            printf 'bare-package=%s\n' "$(node -p "require('./node_modules/bare-runtime/package.json').version")"
            printf 'bare-binary-sha256=%s\n' "$(sha256sum "$bare_bin" | awk '{print $1}')"
            printf 'tor=%s\n' "$(tor --version | sed -n '1p')"
            dpkg-query -W -f='apt-${binary:Package}=${Version}\n' tor
          } | tee evidence/versions.txt
          git diff --exit-code -- package-lock.json

      - name: Prove Hyperswarm over system Tor
        shell: bash
        env:
          DHT_RELAY_TOR_TEST_TOR: '1'
          DHT_RELAY_TOR_TEST_BACKEND: tor
          DHT_RELAY_TOR_TOR_BOOTSTRAP_TIMEOUT: '300000'
          DHT_RELAY_TOR_ARTI_BOOTSTRAP_TIMEOUT: '100000'
          DHT_RELAY_TOR_EXCHANGE_TIMEOUT: '60000'
          DHT_RELAY_TOR_CLEANUP_TIMEOUT: '10000'
          DHT_RELAY_TOR_PROCESS_KILL_TIMEOUT: '10000'
          DHT_RELAY_TOR_OUTER_CLEANUP_RESERVE: '20000'
          DHT_RELAY_TOR_OUTER_TEST_TIMEOUT: ${{ env.SYSTEM_ATTEMPT_TIMEOUT_MS }}
          DHT_RELAY_TOR_WORKFLOW_CLEANUP_RESERVE: ${{ env.PROOF_POST_RESERVE_MS }}
          DHT_RELAY_TOR_WORKFLOW_TIMEOUT: ${{ env.WORKFLOW_TIMEOUT_MS }}
        run: |
          set -euo pipefail
          mkdir -p evidence

          for attempt in 1 2; do
            log="evidence/system-tor-attempt-${attempt}.log"
            set +e
            npm test 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              printf 'successful-attempt=%s\n' "$attempt" > evidence/system-tor-result.txt
              exit 0
            fi
            classification="evidence/system-tor-attempt-${attempt}-classification.json"
            set +e
            node test/classify-tor-proof-failure.js "$log" | tee "$classification"
            classification_status=${PIPESTATUS[0]}
            set -e
            if [[ "$attempt" -lt 2 && "$classification_status" -eq 0 ]] && grep -Fq '"class":"descriptor-publication-transient"' "$classification"; then
              echo 'retrying a recognized hidden-service descriptor publication transient' >&2
              sleep "$((PROOF_RETRY_DELAY_MS / 1000))"
              continue
            fi
            exit "$status"
          done

      - name: Upload system Tor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-tor-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  debug_addon:
    name: Debug addon verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact dht-relay-tor source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check out the exact bare-arti source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ayooooo123/bare-arti
          ref: ${{ env.BARE_ARTI_SHA }}
          path: .proof/bare-arti
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up exact Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # immutable action commit
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build and test a fresh debug addon
        shell: bash
        env:
          BARE_ARTI_SOURCE: ${{ github.workspace }}/.proof/bare-arti
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential
          test "$(git -C "$BARE_ARTI_SOURCE" rev-parse HEAD)" = "$BARE_ARTI_SHA"
          cd "$BARE_ARTI_SOURCE"
          npm ci
          test "$(node -p "require('./node_modules/bare-runtime/package.json').version")" = "$BARE_VERSION"
          test "$(node -p "require('./node_modules/bare-make/package.json').version")" = "$BARE_MAKE_VERSION"
          test "$(node -p "require('./node_modules/cmake-runtime/package.json').version")" = "$CMAKE_RUNTIME_VERSION"
          test "$(node -p "require('./node_modules/cmake-bare/package.json').version")" = "$CMAKE_BARE_VERSION"
          test "$(node -p "require('./node_modules/cmake-cargo/package.json').version")" = "$CMAKE_CARGO_VERSION"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"
          locked_cmake="$(node -p "require('cmake-runtime')()")"
          chmod +x "$locked_cmake"
          "$locked_cmake" --version

          export BARE_ARTI_REAL_CARGO="$(command -v cargo)"
          export PATH="$BARE_ARTI_SOURCE/scripts/locked-bin:$PATH"
          export CMAKE_PROGRAM_PATH="$BARE_ARTI_SOURCE/scripts/locked-bin"
          debug_build="$(mktemp -d)"
          test -z "$(find "$debug_build" -mindepth 1 -print -quit)"
          test ! -e prebuilds
          npx --no-install bare-make generate \
            --debug \
            --no-cache \
            --build "$debug_build" \
            --define BARE_ARTI_TESTING:BOOL=ON \
            --define CMAKE_BUILD_TYPE:STRING=Debug \
            --define CMAKE_PROGRAM_PATH:PATH="$CMAKE_PROGRAM_PATH"
          grep -Fx 'BARE_ARTI_TESTING:BOOL=ON' "$debug_build/CMakeCache.txt"
          grep -Fx 'CMAKE_BUILD_TYPE:STRING=Debug' "$debug_build/CMakeCache.txt"
          npx --no-install bare-make build --build "$debug_build"
          npx --no-install bare-make install \
            --build "$debug_build" \
            --prefix "$BARE_ARTI_SOURCE/prebuilds"
          mkdir -p "$GITHUB_WORKSPACE/evidence-debug"
          bare_bin="$(node -p "require('bare-runtime')('bare')")"
          chmod +x "$bare_bin"
          "$bare_bin" test/addon.js | tee "$GITHUB_WORKSPACE/evidence-debug/addon-test.log"
          {
            printf 'bare-arti-sha=%s\n' "$(git rev-parse HEAD)"
            printf 'cmake=%s\n' "$("$locked_cmake" --version | sed -n '1p')"
            printf 'c-compiler=%s\n' "$(cc --version | sed -n '1p')"
            printf 'cxx-compiler=%s\n' "$(c++ --version | sed -n '1p')"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'cargo=%s\n' "$("$BARE_ARTI_REAL_CARGO" --version)"
          } | tee "$GITHUB_WORKSPACE/evidence-debug/versions.txt"

      - name: Upload debug addon evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-addon-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-debug/
          if-no-files-found: error
          retention-days: 30

  embedded_arti:
    name: Embedded Arti proof
    needs: debug_addon
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact dht-relay-tor source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check out the exact bare-arti source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ayooooo123/bare-arti
          ref: ${{ env.BARE_ARTI_SHA }}
          path: .proof/bare-arti
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up exact Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # immutable action commit
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install exact proof dependencies
        shell: bash
        env:
          BARE_ARTI_SOURCE: ${{ github.workspace }}/.proof/bare-arti
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$BARE_ARTI_SOURCE" rev-parse HEAD)" = "$BARE_ARTI_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential tor
          npm ci
          npm ci --prefix "$BARE_ARTI_SOURCE"
          test "$(node -p "require('./node_modules/bare-runtime/package.json').version")" = "$BARE_VERSION"
          test "$(node -p "require('$BARE_ARTI_SOURCE/node_modules/bare-runtime/package.json').version")" = "$BARE_VERSION"
          test "$(node -p "require('$BARE_ARTI_SOURCE/node_modules/bare-make/package.json').version")" = "$BARE_MAKE_VERSION"
          test "$(node -p "require('$BARE_ARTI_SOURCE/node_modules/cmake-runtime/package.json').version")" = "$CMAKE_RUNTIME_VERSION"
          test "$(node -p "require('$BARE_ARTI_SOURCE/node_modules/cmake-bare/package.json').version")" = "$CMAKE_BARE_VERSION"
          test "$(node -p "require('$BARE_ARTI_SOURCE/node_modules/cmake-cargo/package.json').version")" = "$CMAKE_CARGO_VERSION"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"
          git diff --exit-code -- package-lock.json

      - name: Build and pack a fresh production linux-x64 addon
        id: package
        shell: bash
        env:
          BARE_ARTI_SOURCE: ${{ github.workspace }}/.proof/bare-arti
        run: |
          set -euxo pipefail
          cd "$BARE_ARTI_SOURCE"
          locked_cmake="$(node -p "require('cmake-runtime')()")"
          chmod +x "$locked_cmake"
          "$locked_cmake" --version
          export BARE_ARTI_REAL_CARGO="$(command -v cargo)"
          export PATH="$BARE_ARTI_SOURCE/scripts/locked-bin:$PATH"
          export CMAKE_PROGRAM_PATH="$BARE_ARTI_SOURCE/scripts/locked-bin"
          release_build="$(mktemp -d)"
          test -z "$(find "$release_build" -mindepth 1 -print -quit)"
          test ! -e prebuilds
          npx --no-install bare-make generate \
            --no-cache \
            --build "$release_build" \
            --define BARE_ARTI_TESTING:BOOL=OFF \
            --define CMAKE_BUILD_TYPE:STRING=Release \
            --define CMAKE_PROGRAM_PATH:PATH="$CMAKE_PROGRAM_PATH"
          grep -Fx 'BARE_ARTI_TESTING:BOOL=OFF' "$release_build/CMakeCache.txt"
          grep -Fx 'CMAKE_BUILD_TYPE:STRING=Release' "$release_build/CMakeCache.txt"
          npx --no-install bare-make build --build "$release_build"
          npx --no-install bare-make install \
            --build "$release_build" \
            --prefix "$BARE_ARTI_SOURCE/prebuilds" \
            --strip

          target=linux-x64
          addon="prebuilds/$target/bare-arti.bare"
          test -f "$addon"
          addon_sha256="$(sha256sum "$addon" | awk '{print $1}')"
          compiler_file="$(find "$release_build/CMakeFiles" -mindepth 2 -maxdepth 2 -name CMakeCCompiler.cmake -print -quit)"
          test -f "$compiler_file"
          actual_c_compiler="$(sed -n 's/^set(CMAKE_C_COMPILER "\([^"]*\)")$/\1/p' "$compiler_file")"
          test -x "$actual_c_compiler"
          jq -n \
            --arg sourceSha "$BARE_ARTI_SHA" \
            --arg sourceRepository 'https://github.com/ayooooo123/bare-arti' \
            --arg dhtRelayTorSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg target "$target" \
            --arg addon "$addon" \
            --arg sha256 "$addon_sha256" \
            --arg nodeVersion "$(node --version)" \
            --arg rustVersion "$(rustc --version)" \
            --arg bareVersion "$BARE_VERSION" \
            --arg bareMakeVersion "$BARE_MAKE_VERSION" \
            --arg cmakeRuntimeVersion "$CMAKE_RUNTIME_VERSION" \
            --arg cmakeBareVersion "$CMAKE_BARE_VERSION" \
            --arg cmakeCargoVersion "$CMAKE_CARGO_VERSION" \
            --arg cCompiler "$("$actual_c_compiler" --version | sed -n '1p')" \
            '{sourceSha: $sourceSha, sourceRepository: $sourceRepository,
              dhtRelayTorSha: $dhtRelayTorSha, runId: $runId, runAttempt: $runAttempt,
              target: $target, addon: $addon, sha256: $sha256,
              toolchain: {node: $nodeVersion, rust: $rustVersion, bare: $bareVersion,
                bareMake: $bareMakeVersion, cmakeRuntime: $cmakeRuntimeVersion,
                cmakeBare: $cmakeBareVersion, cmakeCargo: $cmakeCargoVersion,
                cCompiler: $cCompiler}}' > prebuilds/provenance.json

          mkdir -p "$GITHUB_WORKSPACE/evidence" "$RUNNER_TEMP/bare-arti-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/bare-arti-package" \
            > "$GITHUB_WORKSPACE/evidence/npm-pack.json"
          tarball_name="$(node -p \
            "require('$GITHUB_WORKSPACE/evidence/npm-pack.json')[0].filename")"
          tarball="$RUNNER_TEMP/bare-arti-package/$tarball_name"
          test -f "$tarball"
          cp "$tarball" "$GITHUB_WORKSPACE/evidence/"
          cp prebuilds/provenance.json "$GITHUB_WORKSPACE/evidence/"
          cp "$addon" "$GITHUB_WORKSPACE/evidence/bare-arti-linux-x64.bare"
          tarball_sha256="$(sha256sum "$GITHUB_WORKSPACE/evidence/$tarball_name" | awk '{print $1}')"
          sha256sum \
            "$GITHUB_WORKSPACE/evidence/$tarball_name" \
            "$GITHUB_WORKSPACE/evidence/bare-arti-linux-x64.bare" \
            | tee "$GITHUB_WORKSPACE/evidence/artifact-sha256.txt"
          printf '%s  %s\n' "$tarball_sha256" "$tarball_name" \
            > "$GITHUB_WORKSPACE/evidence/attestation-manifest.txt"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
          printf 'tarball_name=%s\n' "$tarball_name" >> "$GITHUB_OUTPUT"
          printf 'tarball_sha256=%s\n' "$tarball_sha256" >> "$GITHUB_OUTPUT"
          printf 'addon_sha256=%s\n' "$addon_sha256" >> "$GITHUB_OUTPUT"
          printf 'release_build=%s\n' "$release_build" >> "$GITHUB_OUTPUT"
          git diff --exit-code -- package-lock.json

      - name: Install and verify the exact packed artifact in Node and Bare
        shell: bash
        env:
          BARE_ARTI_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euxo pipefail
          lock_sha256="$(sha256sum package-lock.json | awk '{print $1}')"
          npm install --no-save --package-lock=false "$BARE_ARTI_TARBALL"
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "$lock_sha256"
          node test/verify-installed-bare-arti.js "$BARE_ARTI_SHA" \
            | tee evidence/node-install-verification.json
          bare_bin="$(node -p "require('bare-runtime')('bare')")"
          chmod +x "$bare_bin"
          "$bare_bin" test/verify-installed-bare-arti.js "$BARE_ARTI_SHA" \
            | tee evidence/bare-install-verification.json
          grep -F '"addonLoaded":true' evidence/bare-install-verification.json
          git diff --exit-code -- package-lock.json

      - name: Inventory and summarize the embedded proof
        shell: bash
        env:
          BARE_ARTI_SOURCE: ${{ github.workspace }}/.proof/bare-arti
          RELEASE_BUILD: ${{ steps.package.outputs.release_build }}
          ADDON_SHA256: ${{ steps.package.outputs.addon_sha256 }}
          TARBALL_SHA256: ${{ steps.package.outputs.tarball_sha256 }}
        run: |
          set -euxo pipefail
          locked_cmake="$(cd "$BARE_ARTI_SOURCE" && node -p "require('cmake-runtime')()")"
          chmod +x "$locked_cmake"
          compiler_file="$(find "$RELEASE_BUILD/CMakeFiles" -mindepth 2 -maxdepth 2 -name CMakeCCompiler.cmake -print -quit)"
          test -f "$compiler_file"
          actual_c_compiler="$(sed -n 's/^set(CMAKE_C_COMPILER "\([^"]*\)")$/\1/p' "$compiler_file")"
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          bare_version="$(node -p "require('./node_modules/bare-runtime/package.json').version")"
          bare_bin="$(node -p "require('bare-runtime')('bare')")"
          chmod +x "$bare_bin"
          bare_binary_sha256="$(sha256sum "$bare_bin" | awk '{print $1}')"
          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          cmake_version="$("$locked_cmake" --version | sed -n '1p')"
          c_compiler_version="$("$actual_c_compiler" --version | sed -n '1p')"
          cxx_compiler_version="$(c++ --version | sed -n '1p')"
          tor_version="$(tor --version | sed -n '1p')"
          {
            printf 'dht-relay-tor-sha=%s\n' "$(git rev-parse HEAD)"
            printf 'bare-arti-sha=%s\n' "$(git -C "$BARE_ARTI_SOURCE" rev-parse HEAD)"
            printf 'run-id=%s\n' "$GITHUB_RUN_ID"
            printf 'run-attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'addon-sha256=%s\n' "$ADDON_SHA256"
            printf 'tarball-sha256=%s\n' "$TARBALL_SHA256"
            printf 'runner-image=%s\n' "${ImageOS:-unknown}-${ImageVersion:-unknown}"
            printf 'node=%s\n' "$node_version"
            printf 'npm=%s\n' "$npm_version"
            printf 'bare-package=%s\n' "$bare_version"
            printf 'bare-binary-sha256=%s\n' "$bare_binary_sha256"
            printf 'rustc=%s\n' "$rustc_version"
            printf 'cargo=%s\n' "$cargo_version"
            printf 'cmake=%s\n' "$cmake_version"
            printf 'c-compiler=%s\n' "$c_compiler_version"
            printf 'cxx-compiler=%s\n' "$cxx_compiler_version"
            printf 'tor=%s\n' "$tor_version"
            printf 'bare-make=%s\n' "$BARE_MAKE_VERSION"
            printf 'cmake-runtime=%s\n' "$CMAKE_RUNTIME_VERSION"
            printf 'cmake-bare=%s\n' "$CMAKE_BARE_VERSION"
            printf 'cmake-cargo=%s\n' "$CMAKE_CARGO_VERSION"
            dpkg-query -W -f='apt-${binary:Package}=${Version}\n' build-essential tor
          } | tee evidence/versions.txt
          {
            printf '## Embedded Arti exact-source proof\n\n'
            printf '| Evidence | Value |\n|---|---|\n'
            printf '| dht-relay-tor-sha | `%s` |\n' "$(git rev-parse HEAD)"
            printf '| bare-arti-sha | `%s` |\n' "$(git -C "$BARE_ARTI_SOURCE" rev-parse HEAD)"
            printf '| run-id / run-attempt | `%s` / `%s` |\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '| addon-sha256 | `%s` |\n' "$ADDON_SHA256"
            printf '| tarball-sha256 | `%s` |\n' "$TARBALL_SHA256"
            printf '| Node / npm / Bare package | `%s` / `%s` / `%s` |\n' "$node_version" "$npm_version" "$bare_version"
            printf '| Bare binary sha256 | `%s` |\n' "$bare_binary_sha256"
            printf '| Rust / Cargo | `%s` / `%s` |\n' "$rustc_version" "$cargo_version"
            printf '| CMake | `%s` |\n' "$cmake_version"
            printf '| C compiler | `%s` |\n' "$c_compiler_version"
            printf '| C++ compiler | `%s` |\n' "$cxx_compiler_version"
            printf '| Tor | `%s` |\n' "$tor_version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the exact package and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedded-arti-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  embedded_proof:
    name: Embedded Arti network proof
    needs: embedded_arti
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact dht-relay-tor source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download the exact built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-arti-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Install the exact proof inputs
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tor
          npm ci
          mapfile -t tarballs < <(find evidence -maxdepth 1 -type f -name 'bare-arti-*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          (cd evidence && sha256sum --check attestation-manifest.txt)
          tarball="$(realpath "${tarballs[0]}")"
          npm install --no-save --package-lock=false "$tarball"
          node test/verify-installed-bare-arti.js "$BARE_ARTI_SHA" \
            | tee evidence/proof-node-install-verification.json
          bare_bin="$(node -p "require('bare-runtime')('bare')")"
          chmod +x "$bare_bin"
          "$bare_bin" test/verify-installed-bare-arti.js "$BARE_ARTI_SHA" \
            | tee evidence/proof-bare-install-verification.json
          grep -F '"addonLoaded":true' evidence/proof-bare-install-verification.json
          git diff --exit-code -- package-lock.json

      - name: Prove Hyperswarm over embedded Arti
        shell: bash
        env:
          DHT_RELAY_TOR_TEST_TOR: '1'
          DHT_RELAY_TOR_TEST_BACKEND: arti
          DHT_RELAY_TOR_TOR_BOOTSTRAP_TIMEOUT: '90000'
          DHT_RELAY_TOR_ARTI_BOOTSTRAP_TIMEOUT: '450000'
          DHT_RELAY_TOR_EXCHANGE_TIMEOUT: '60000'
          DHT_RELAY_TOR_CLEANUP_TIMEOUT: '20000'
          DHT_RELAY_TOR_PROCESS_KILL_TIMEOUT: '10000'
          DHT_RELAY_TOR_OUTER_CLEANUP_RESERVE: '20000'
          DHT_RELAY_TOR_OUTER_TEST_TIMEOUT: ${{ env.EMBEDDED_ATTEMPT_TIMEOUT_MS }}
          DHT_RELAY_TOR_WORKFLOW_CLEANUP_RESERVE: ${{ env.PROOF_POST_RESERVE_MS }}
          DHT_RELAY_TOR_WORKFLOW_TIMEOUT: ${{ env.WORKFLOW_TIMEOUT_MS }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            log="evidence/embedded-arti-attempt-${attempt}.log"
            set +e
            npm test 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              printf 'successful-attempt=%s\n' "$attempt" > evidence/embedded-arti-result.txt
              exit 0
            fi
            classification="evidence/embedded-arti-attempt-${attempt}-classification.json"
            set +e
            node test/classify-tor-proof-failure.js "$log" | tee "$classification"
            classification_status=${PIPESTATUS[0]}
            set -e
            if [[ "$attempt" -lt 2 && "$classification_status" -eq 0 ]] && grep -Fq '"class":"descriptor-publication-transient"' "$classification"; then
              echo 'retrying a recognized hidden-service descriptor publication transient' >&2
              sleep "$((PROOF_RETRY_DELAY_MS / 1000))"
              continue
            fi
            exit "$status"
          done

      - name: Upload embedded proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedded-arti-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest exact bare-arti tarball
    needs: embedded_proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-arti-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Independently verify the attestation subject digest
        id: subject
        shell: bash
        run: |
          set -euxo pipefail
          cd evidence
          test "$(find . -maxdepth 1 -type f -name 'bare-arti-*.tgz' | wc -l)" -eq 1
          grep -Eq '^[0-9a-f]{64}  bare-arti-[0-9]+\.[0-9]+\.[0-9]+\.tgz$' attestation-manifest.txt
          sha256sum --check attestation-manifest.txt
          tarball_name="$(awk '{print $2}' attestation-manifest.txt)"
          test -f "$tarball_name"
          printf 'path=%s\n' "$GITHUB_WORKSPACE/evidence/$tarball_name" >> "$GITHUB_OUTPUT"

      - name: Attest the independently verified tarball
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.subject.outputs.path }}
